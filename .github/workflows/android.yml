name: APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar ficheiro
        run: cp android/app/build/outputs/apk/release/app-release.apk Tacografo.apk

      - name: Publicar no GitHub (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: App Android v2.3.${{ github.run_number }}
          make_latest: true
          files: Tacografo.apk
          body: |
            App Android do Controle de Tacógrafo.
            No telemóvel: descarregar **Tacografo.apk**, abrir e permitir "instalar apps desconhecidas".
            Instala por cima da versão anterior sem perder dados.
