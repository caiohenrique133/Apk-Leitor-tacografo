/* ---- ecrã / PDF ---- */
function rjCel(v,t){
  if(v==null||v==='')return '';
  if(t==='d')return dPT(v);
  if(t==='dt')return dtl(v);
  if(t==='m')return dPT(v+'-01').slice(3);
  if(t==='h'||t==='hb'||t==='hA'||t==='hD')return hm(v);
  if(t==='eur')return eurN(v)+' €';
  if(t==='e')return `<span class="rj-st ${corEst(String(v))}">${esc(v)}</span>`;
  return esc(v);
}
function rjFolhaHTML(id,F,R){
  const tab=(f,cls)=>`<div class="rj-tw"><table class="${cls||''}"><thead><tr>${f.cab.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${f.linhas.map(l=>`<tr class="${l.vazia?'vazia':''}${l.fds?' fds':''}${l.extra?' ext':''}">${l.v.map((v,i)=>{const t=f.tipos[i];
      const red=(t==='hA'&&v>15*60)||(t==='hD'&&v<9*60), amb=t==='hA'&&v>13*60&&v<=15*60;
      return `<td class="${t==='s'&&i>2?'txt':''}${red?' vbad':amb?' vwarn':''}">${t==='hb'?'<b>'+rjCel(v,t)+'</b>':rjCel(v,t)}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${f.cab.length}">Sem registos no período.</td></tr>`}</tbody>
    ${f.total?`<tfoot><tr class="tot">${f.total.map((v,i)=>`<td>${typeof v==='number'?rjCel(v,f.tipos[i]==='hb'?'h':f.tipos[i]):esc(v)}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;
  if(id==='dados')return `<div class="rj"><h3>DADOS — REGISTO DIÁRIO</h3><div class="rj-id">${rjIdLinha(R).map(esc).join(' · ')}</div>${tab(F,'rj-dados')}
    <div class="rj-nota">Total = jornada do início ao fim do turno. Fins de semana com a data a cor de laranja; dias Extra a amarelo. Tipo Registo: Digital (cartão) ou a origem dos dias inseridos à mão.</div></div>`;
  const k=(l,v,t)=>`<div class="rj-k"><span>${l}</span><b>${t==='h'?hm(v):t==='eur'?eurN(v)+' €':v}</b></div>`;
  return `<div class="rj"><h3>${F.titulo}</h3><div class="rj-sub">${F.sub}</div><div class="rj-id">${rjIdLinha(R).map(esc).join(' · ')}</div>
    ${F.kpis&&F.kpis.length?`<div class="rj-kpis">${F.kpis.map(x=>k(...x)).join('')}</div>`:''}
    <h4>${F.seccao}</h4>${tab(F)}
    ${F.nota?`<div class="rj-nota">${F.nota}</div>`:''}
    <div class="rj-nota">Gerado em ${new Date().toLocaleString('pt-PT')} · Controle de Tacógrafo</div></div>`;
}
function relJornada(){
  const ms=[...new Set(ROWS.map(r=>r.iso.slice(0,7)))];
  const R=relJornadaDados(RJ_MES);
  const ctl=`<div class="row noprint"><button class="btn" id="rjVolta">← Voltar</button>
    <select id="rjMes" aria-label="Período"><option value="">Todo o período</option>${ms.map(m=>`<option value="${m}" ${RJ_MES===m?'selected':''}>${dPT(m+'-01').slice(3)}</option>`).join('')}</select>
    <button class="btn amber" id="rjPrint">🖨 Imprimir / PDF</button><button class="btn" id="rjXlsx">⇩ Excel (5 folhas)</button></div>
    <div class="row noprint rj-abas">${RJ_ABAS.map(([id,n])=>`<button class="btn ${RJ_ABA===id?'amber':''}" data-rja="${id}">${n}</button>`).join('')}<button class="btn ${RJ_ABA==='todas'?'amber':''}" data-rja="todas">Todas</button></div>`;
  if(!R)return ctl+'<div class="empty">Sem dias de trabalho no período escolhido.</div>';
  const F=rjFolhas(R);
  const larga=RJ_ABA!=='jornada'&&RJ_ABA!=='extras';
  const corpo=RJ_ABA==='todas'?RJ_ABAS.map(([id],i)=>`<div class="${i?'rj-quebra':''}">${rjFolhaHTML(id,F[id],R)}</div>`).join('')
    :rjFolhaHTML(RJ_ABA,F[RJ_ABA],R);
  return ctl+(larga||RJ_ABA==='todas'?'<style>@page{size:A4 landscape;margin:8mm}</style>':'')+corpo;
}

/* ---- Excel com formatação (xlsx-js-style: mesma API do SheetJS, com cores e bordas) ---- */
async function carregaXLSX(){
  if(window.XLSX&&XLSX.__estilos)return;
  await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
  XLSX.__estilos=true;
}
const XC={AZ:'1F4E79',CL:'DDEBF7',BD:'B7C9E0',ROXO:'CCCCFF'};
function xFolha(){
  const BD={style:'thin',color:{rgb:XC.BD}},borda={top:BD,bottom:BD,left:BD,right:BD};
  const ws={},M=[];let maxR=0,maxC=0;
  const put=(r,c,v,s,t,z)=>{const o={v,t:t||(typeof v==='number'?'n':'s'),s:s||{}};if(z)o.z=z;ws[XLSX.utils.encode_cell({r,c})]=o;if(r>maxR)maxR=r;if(c>maxC)maxC=c};
  const fim=(cols,rows)=>{ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}});ws['!merges']=M;ws['!cols']=cols.map(w=>({wch:w}));if(rows)ws['!rows']=rows;return ws};
  return {ws,M,put,fim,borda};
}
const xDia=iso=>Date.parse(iso+'T00:00:00Z')/86400000+25569;
const xAbs=abs=>L(abs)/1440+25569;   // minutos UTC → data/hora local em série do Excel
const XEST={bad:{c:'9C0006',f:'FFC7CE'},warn:{c:'9C6500',f:'FFEB9C'},ok:{c:'006100',f:'C6EFCE'}};
/* célula de tabela já com tipo, formato e cor condicional */
function xCel(X,r,c,v,t,base){
  const s=JSON.parse(JSON.stringify(base));
  if(v==null||v===''){X.put(r,c,'',s);return}
  if(t==='d')return X.put(r,c,xDia(v),s,'n','dd/mm/yyyy');
  if(t==='dt')return X.put(r,c,xAbs(v),s,'n','dd/mm/yyyy h:mm');
  if(t==='m')return X.put(r,c,xDia(v+'-01'),s,'n','mmm-yy');
  if(t==='h'||t==='hb'||t==='hA'||t==='hD'){
    if(t==='hb')s.font={...s.font,bold:true};
    const red=(t==='hA'&&v>15*60)||(t==='hD'&&v<9*60),amb=t==='hA'&&v>13*60&&v<=15*60;
    if(red)s.font={...s.font,color:{rgb:XEST.bad.c}},s.fill={fgColor:{rgb:XEST.bad.f}};
    else if(amb)s.font={...s.font,color:{rgb:XEST.warn.c}},s.fill={fgColor:{rgb:XEST.warn.f}};
    return X.put(r,c,v/1440,s,'n','[h]:mm');
  }
  if(t==='eur')return X.put(r,c,Math.round(v*100)/100,s,'n','#,##0.00 €');
  if(t==='n')return X.put(r,c,v,s,'n','0');
  if(t==='e'){const k=corEst(String(v));if(k){s.font={...s.font,color:{rgb:XEST[k].c}};s.fill={fgColor:{rgb:XEST[k].f}}}}
  if(t==='s')s.alignment={horizontal:'left',vertical:'center'};
  X.put(r,c,String(v),s);
}
/* folha com título, subtítulo, caixas de totais e tabela — o padrão de JORNADA TOTAL, DL 84 e DESCANSOS */
function xFolhaPadrao(F,R,cols,corKpi){
  const X=xFolha(),nC=F.cab.length;
  const cen={horizontal:'center',vertical:'center',wrapText:true};
  X.put(1,1,F.titulo,{font:{bold:true,sz:18,color:{rgb:XC.AZ}}});
  X.put(2,1,F.sub,{font:{sz:9,color:{rgb:'666666'}},alignment:{wrapText:true,vertical:'top'}});X.M.push({s:{r:2,c:1},e:{r:2,c:Math.min(nC,12)}});
  X.put(3,1,rjIdLinha(R).join('  ·  '),{font:{sz:10,color:{rgb:XC.AZ}}});X.M.push({s:{r:3,c:1},e:{r:3,c:Math.min(nC,12)}});
  (F.kpis||[]).forEach(([l,v,t],i)=>{const c=1+i*2,fill={fgColor:{rgb:corKpi||XC.CL}};
    X.put(4,c,l,{font:{bold:true,sz:9,color:{rgb:XC.AZ}},fill,alignment:cen});X.put(4,c+1,'',{fill});
    const sv={font:{bold:true,sz:16,color:{rgb:XC.AZ}},fill,alignment:cen};
    if(t==='h')X.put(5,c,v/1440,sv,'n','[h]:mm');else if(t==='eur')X.put(5,c,Math.round(v*100)/100,sv,'n','#,##0.00 €');else X.put(5,c,v,sv,'n','0');
    X.put(5,c+1,'',{fill});X.put(6,c,'',{fill});X.put(6,c+1,'',{fill});
    X.M.push({s:{r:4,c},e:{r:4,c:c+1}},{s:{r:5,c},e:{r:6,c:c+1}});
  });
  X.put(9,1,F.seccao,{font:{bold:true,sz:12,color:{rgb:XC.AZ}}});
  F.cab.forEach((h,i)=>X.put(10,1+i,h,{font:{bold:true,sz:10,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:XC.AZ}},alignment:cen,border:X.borda}));
  const base={font:{sz:10},alignment:{horizontal:'center',vertical:'center'},border:X.borda};
  let r=11;
  for(const l of F.linhas){l.v.forEach((v,i)=>xCel(X,r,1+i,v,F.tipos[i],l.vazia?{...base,font:{sz:10,color:{rgb:'999999'}}}:base));r++}
  if(F.total){const tb={font:{bold:true,sz:10,color:{rgb:XC.AZ}},alignment:{horizontal:'center'},border:X.borda};
    F.total.forEach((v,i)=>typeof v==='number'?xCel(X,r,1+i,v,F.tipos[i]==='hb'?'h':F.tipos[i],tb):X.put(r,1+i,v,tb));r++}
  if(F.nota){X.put(r+1,1,F.nota,{font:{sz:9,color:{rgb:'666666'}},alignment:{wrapText:true,vertical:'top'}});X.M.push({s:{r:r+1,c:1},e:{r:r+1,c:Math.min(nC,11)}})}
  const rows=[];rows[1]={hpt:24};rows[2]={hpt:F.sub.length>400?78:F.sub.length>200?48:28};if(F.nota)rows[r+1]={hpt:42};rows[10]={hpt:30};
  return X.fim(cols,rows);
}
function folhaDados(F){
  const X=xFolha();
  F.cab.forEach((h,i)=>X.put(0,i,h,{font:{bold:true,sz:10,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:XC.AZ}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:X.borda}));
  let r=1;
  for(const l of F.linhas){
    const base={font:{sz:10},alignment:{horizontal:'center',vertical:'center'},border:X.borda};
    if(l.extra)base.fill={fgColor:{rgb:'FFF2CC'}};
    l.v.forEach((v,i)=>{const b=(l.fds&&i<2&&!l.extra)?{...base,fill:{fgColor:{rgb:'FCE4D6'}}}:base;xCel(X,r,i,v,F.tipos[i],b)});r++;
  }
  return X.fim([11.4,6,15.7,15.7,8,10,10,12,10,8,8,68,8,8,16],[{hpt:30}]);
}
function folhaJornada(R){const F=rjFolhas(R);return xFolhaPadrao(F.jornada,R,[2,14,14,7,13,14,13,14,11,15,14,13,13])}
async function exportaRelJornada(){
  const R=relJornadaDados(RJ_MES);if(!R)return;
  try{await carregaXLSX()}catch(e){alert('Sem ligação para carregar a biblioteca Excel. Usa Imprimir / PDF, que funciona offline.');return}
  const F=rjFolhas(R),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,folhaDados(F.dados),'DADOS');
  XLSX.utils.book_append_sheet(wb,xFolhaPadrao(F.jornada,R,[2,14,14,7,13,14,13,14,11,15,14,13,13]),'JORNADA TOTAL');
  XLSX.utils.book_append_sheet(wb,xFolhaPadrao(F.dl84,R,[2,17,14,7,13,15,16,13,14,16,11,10,13,22,18,18,22,14],XC.ROXO),'DL 84 2026');
  XLSX.utils.book_append_sheet(wb,xFolhaPadrao(F.desc,R,[2,13,17,17,13,17,13,13,24,56,13,16,14,30,12,12,15,15]),'DESCANSOS');
  XLSX.utils.book_append_sheet(wb,xFolhaPadrao(F.extras,R,[2,13,8,12,60,10,8,12,9,30,14]),'EXTRAS');
  const nome='Relatorio_Jornada_'+(R.mes?R.mes:R.ini+'_a_'+R.fim)+'.xlsx';
  download(nome,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

/* ============ EVENTOS / EXPORTS ============ */
function parseHM(v){const m=String(v).trim().match(/^(\d{1,2})[:hH.]?(\d{0,2})$/);return m?(+m[1])*60+(+m[2]||0):0}
function dadosMatrix(){
  const head=['Data','Dia','Início','Fim','Total','Condução','Outros Trabalhos','Disponibilidade','Espera Doc.','Pausa','KM','Observações','Mês','Extra','Origem'];
  const rows=ROWS.map(r=>[dPT(r.iso),r.dia,dPT(r.iso)+' '+clk(r.stl),dPT(dISO(new Date(L(r.en)*60000)))+' '+clk(r.enl),
    hm(r.trabalho+r.esp),hm(r.cond),hm(r.ot),hm(r.disp),hm(r.esp),hm(r.pausa),r.km,r.obs,dPT(r.iso.slice(0,7)+'-01').slice(3),r.extra?'SIM':'',r.man?(S.man[r.iso]&&S.man[r.iso].src||'Disco'):'Cartão']);
  return [head,...rows];
}
function download(name,blob){
  if(AND&&AND.guardar){
    const fr=new FileReader();
    fr.onload=()=>{try{const r=AND.guardar(name,String(fr.result).split(',')[1]);alert(r||('Guardado em Transferências: '+name))}catch(e){alert('Não consegui guardar o ficheiro.')}};
    fr.readAsDataURL(blob);return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
if(AND&&AND.imprimir&&typeof window!=='undefined')window.print=()=>{try{AND.imprimir()}catch(e){}};

/* Guardar/repor ficheiros do cartão entre sessões via IndexedDB */
const IDB={
  open:()=>new Promise((ok,ko)=>{const r=indexedDB.open('tacho',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>ok(r.result);r.onerror=ko}),
  set:async(k,v)=>{const db=await IDB.open();return new Promise((ok,ko)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(v,k);t.oncomplete=ok;t.onerror=ko})},
  get:async(k)=>{const db=await IDB.open();return new Promise((ok,ko)=>{const t=db.transaction('files');const rq=t.objectStore('files').get(k);rq.onsuccess=()=>ok(rq.result);rq.onerror=ko})},
  chaves:async()=>{const db=await IDB.open();return new Promise((ok,ko)=>{const t=db.transaction('files');const rq=t.objectStore('files').getAllKeys();rq.onsuccess=()=>ok(rq.result.map(String));rq.onerror=ko})},
  all:async()=>{const db=await IDB.open();return new Promise((ok,ko)=>{const t=db.transaction('files');const rq=t.objectStore('files').getAll();rq.onsuccess=()=>ok(rq.result);rq.onerror=ko})}
};

  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  try{

const _oldChange=$('#fileIn').onchange;
$('#fileIn').onchange=async e=>{
  let n=0;
  for(const f of e.target.files){
    try{const ab=await f.arrayBuffer();RAW.push(parseDDD(ab));await IDB.set(f.name+'_'+f.size,ab);n++}
    catch(x){alert('Não consegui ler '+f.name+'.')}
  }
  if(n)rebuild();
  e.target.value='';
};
