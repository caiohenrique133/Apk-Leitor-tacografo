<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15191E">
<title>Controle de Tacógrafo — Caio</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* modo claro/escuro — mesma chave da CAL LOG; claro por defeito */
(function(){var K='cal-log-theme',t;try{t=new URLSearchParams(location.search).get('theme')||localStorage.getItem(K)}catch(e){}
if(t!=='light'&&t!=='dark')t='light';document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
/* ===== Tema CAL LOG — asfalto, papel e âmbar (igual à Gestão de Transportes) ===== */
:root{
  --asfalto:#15191E; --asfalto2:#1d232a;
  --bg:#F4F4F1; --panel:#FFFFFF; --panel2:#F8F7F3; --line:#e3e1da;
  --ink:#1c2126; --dim:#69727c; --faint:#9aa1aa;
  --amber:#FFB400; --amber-dim:#ffe2a3;
  --drive:#FFB400; --work:#3E7CB1; --avail:#A85FBF; --rest:#1E9E6A; --espera:#d9a400;
  --ok:#1E9E6A; --warn:#c98a00; --bad:#D64545; --info:#3E7CB1;
  --ok-bg:#e2f4eb; --warn-bg:#fff2d1; --bad-bg:#fbe5e5; --info-bg:#e2edf7;
  --track:#eeede8; --s-pausa:#cfd6dc; --s-off:#f1f0ec;
  --btn:#15191E; --btn-ink:#fff;
  --r:10px; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
html[data-theme="dark"]{
  --asfalto:#0d1013; --asfalto2:#14181d;
  --bg:#14171b; --panel:#1c2127; --panel2:#22282f; --line:#2a2f36;
  --ink:#e8e6e1; --dim:#8b929c; --faint:#626a74;
  --amber-dim:#5a4510;
  --rest:#2fb87d; --ok:#2fb87d; --warn:#f2c14e; --bad:#e25b5b; --info:#5a9ad6; --work:#5a9ad6;
  --ok-bg:#16301f; --warn-bg:#3a2f12; --bad-bg:#3c1c1c; --info-bg:#152c40;
  --track:#121519; --s-pausa:#3a434e; --s-off:#121519;
  --btn:#FFB400; --btn-ink:#15191E;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
::selection{background:var(--amber-dim)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,180,0,.18)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
h1{font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
h2{font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:18px;height:3px;flex:none;background:repeating-linear-gradient(90deg,var(--amber) 0 6px,transparent 6px 9px)}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.mono,td.t,.kpi b{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- estrutura: barra lateral + conteúdo ---- */
.app{display:flex;min-height:100vh}
.side{width:218px;flex-shrink:0;background:var(--asfalto);color:#e8e6e1;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--amber);color:#15191E;display:flex;align-items:center;justify-content:center;flex:none}
.brand-name{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.08em;line-height:1}
.brand-sub{font-size:11px;color:#9aa3ad;margin-top:2px}
.roadline{height:3px;background:repeating-linear-gradient(90deg,var(--amber) 0 18px,transparent 18px 32px);margin:0 8px 14px;opacity:.9}
.roadline.wide{margin:0;opacity:1}
#tabs{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;color:#c4cad1;font-weight:500;border-radius:7px;text-align:left;position:relative;white-space:nowrap}
.nav-item svg{flex:none}
.nav-item:hover{background:var(--asfalto2);color:#fff}
.nav-item.on{background:var(--asfalto2);color:var(--amber)}
.nav-item.on::before{content:'';position:absolute;left:-2px;top:8px;bottom:8px;width:3px;background:repeating-linear-gradient(180deg,var(--amber) 0 6px,transparent 6px 10px);border-radius:2px}
.side-foot{margin-top:12px;border-top:1px solid #2a313a;padding-top:10px}
.estado{font-size:11px;color:#6d7681;padding:4px 12px;font-family:var(--mono)}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 26px 14px;gap:16px;flex-wrap:wrap}
.hsub{font-size:12px;color:var(--dim);margin-top:3px}
.top-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top-ctrl select{padding:8px 10px;width:auto;max-width:210px}
main{padding:20px 26px 40px;max-width:1280px;width:100%}
section{display:none}section.on{display:block}
#cl-theme-toggle{position:fixed;bottom:16px;right:16px;z-index:9999;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}

/* ---- indicadores ---- */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kpi b{display:block;font-family:var(--cond)!important;font-weight:700;font-size:30px;line-height:1.1;margin-top:6px}
.kpi small{color:var(--dim);font-size:12px}
.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.kpi.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.kpi.warn{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}

/* ---- tabelas ---- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:9px 10px;border-bottom:2px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--panel2)}
td.t{text-align:right}
tr.sub td{color:var(--dim)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:2px 7px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.info{background:var(--info-bg);color:var(--info)}
.tag.dim{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}

/* ---- faixa das 24h (disco) ---- */
.strip{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--s-off);min-width:190px;border:1px solid var(--line)}
.strip i{display:block;height:100%}
.sD{background:var(--drive)}.sW{background:var(--work)}.sA{background:var(--avail)}.sR{background:var(--s-pausa)}.sO{background:var(--s-off)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:8px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---- barras ---- */
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--bad)}

/* ---- cartões, botões e avisos ---- */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px}
.btn:hover{border-color:var(--ink)}
.btn.amber{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.amber:hover{filter:brightness(1.15)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.filebtn{display:inline-flex;align-items:center;gap:6px;background:var(--amber);color:#15191E;font-weight:700;border-radius:7px;padding:8px 13px;font-size:13px}
.filebtn:active{transform:translateY(1px)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--dim)}
.note{font-size:12px;color:var(--dim)}
.sem{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;box-shadow:0 0 0 3px var(--panel2)}
.sem.g{background:var(--ok)}.sem.y{background:var(--amber)}.sem.r{background:var(--bad)}
.alert{border:1px solid var(--line);border-left:4px solid var(--info);background:var(--panel);border-radius:8px;padding:10px 12px;margin:8px 0}
.alert.LEVE{border-left-color:var(--info)}.alert.GRAVE{border-left-color:var(--amber)}
.alert.MUITO_GRAVE{border-left-color:#e8742c}.alert.MAXIMA{border-left-color:var(--bad)}
.alert .g{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.alert.LEVE .g{color:var(--info)}.alert.GRAVE .g{color:var(--warn)}.alert.MUITO_GRAVE .g{color:#e8742c}.alert.MAXIMA .g{color:var(--bad)}
.alert .lb{font-size:11px;color:var(--dim)}
.empty{padding:40px 20px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:var(--r);background:var(--panel)}
footer{margin:10px 26px 30px;font-size:11px;color:var(--dim);line-height:1.6;max-width:1280px}
input.mini{width:76px;padding:4px 6px;font-family:var(--mono);text-align:right}
input.obs{width:200px}
td .chk{width:16px;height:16px;accent-color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
/* ---- fotos dos discos ---- */
.fgrupo{margin:6px 0 16px}
.fmes{font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;margin:4px 0 8px;color:var(--ink)}
.fmes span{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.ftile{position:relative;display:block;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);padding:0}
.ftile img{width:100%;height:100%;object-fit:cover;display:block}
.ftile span{position:absolute;left:0;right:0;bottom:0;padding:14px 7px 5px;font-size:11.5px;font-weight:600;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65));font-family:var(--mono)}
.ftile:hover{border-color:var(--amber)}
.fDia{padding:3px 8px;font-size:12px}
.fview{position:fixed;inset:0;z-index:10000;background:rgba(10,12,15,.96);display:flex;flex-direction:column;color:#e8e6e1}
.fview[hidden]{display:none}
.fv-top,.fv-bot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.fv-bot{justify-content:center;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.fview .note{color:#b9c0c8}
.fview input{background:#1c2127;color:#e8e6e1;border-color:#2a2f36}
.fview .btn{background:#1c2127;color:#e8e6e1;border-color:#2a2f36}
.fview .btn.amber{background:var(--amber);color:#15191E;border-color:var(--amber)}
.fview .btn.danger{color:#ff8a8a;border-color:#7a3434}
.fview .btn:disabled{opacity:.35}
.fv-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;touch-action:pinch-zoom}
.fv-img img{max-width:100%;max-height:100%;object-fit:contain}
.fv-img.zoom{overflow:auto;align-items:flex-start;justify-content:flex-start;cursor:zoom-out}
.fv-img.zoom img{max-width:none;max-height:none}
@media(max-width:980px){.fgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}}
/* ---- permissão da câmara ---- */
.camperm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;padding:10px 12px;border:1px dashed var(--amber);border-radius:9px;background:var(--warn-bg)}
.camperm-t{font-weight:600}
.camperm .note{flex-basis:100%}
.camok{color:var(--ok)}
.cam-b2{background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:10px 14px;font-weight:600}
.cam-msg small{font-size:13px;color:#d6dbe0}
/* ---- câmara integrada ---- */
.camv{position:fixed;inset:0;z-index:10001;background:#000;color:#fff;overflow:hidden;touch-action:none}
.camv[hidden]{display:none}
.camv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.cam-guia{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;padding-bottom:56px}
.cam-guia div{width:min(84vw,calc(100vh - 260px),640px);aspect-ratio:1;border-radius:50%;border:3px dashed var(--amber);box-shadow:0 0 0 9999px rgba(0,0,0,.42)}
.cam-guia.livre div{border:2px solid rgba(255,255,255,.35);border-radius:14px;box-shadow:none;width:calc(100vw - 24px);height:calc(100vh - 220px);aspect-ratio:auto}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.on{animation:camFlash .28s ease-out}
@keyframes camFlash{from{opacity:.85}to{opacity:0}}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:max(12px,env(safe-area-inset-top)) 12px 12px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.cam-b{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.28)}
.cam-b[hidden]{display:none}
.cam-b[aria-pressed="true"]{background:var(--amber);color:#15191E;border-color:var(--amber)}
.cam-data{font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.cam-sp{flex:1}
.cam-msg{position:absolute;left:0;right:0;top:42%;text-align:center;padding:0 28px;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.cam-msg:empty{display:none}
.cam-bot{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 22px max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.cam-disp{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.cam-disp i{width:62px;height:62px;border-radius:50%;background:var(--amber);transition:transform .1s}
.cam-disp:active i{transform:scale(.88)}
.cam-disp:disabled{opacity:.45}
.cam-thumb{justify-self:start;width:56px;height:56px;border-radius:11px;border:2px solid #fff;background:#222 center/cover no-repeat;position:relative}
.cam-thumb:disabled{opacity:.35}
.cam-thumb span{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--amber);color:#15191E;font:700 12px/22px var(--mono);padding:0 5px}
.cam-thumb span:empty{display:none}
.cam-ok{justify-self:end;background:var(--amber);color:#15191E;font-weight:700;border-radius:8px;padding:11px 16px}
/* relatório de jornada — mesmo padrão da folha "JORNADA TOTAL" do Excel (papel branco, azul 1F4E79) */
.rj{background:#fff;color:#222;border-radius:var(--r);padding:22px 20px;font-family:Calibri,'Segoe UI',system-ui,sans-serif}
.rj h3{color:#1F4E79;font-size:22px;font-weight:700;margin:0 0 4px}
.rj .rj-sub{font-size:11px;color:#666;margin-bottom:6px}
.rj .rj-id{font-size:12px;color:#1F4E79;margin-bottom:14px}
.rj .rj-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:22px}
@media(max-width:760px){.rj .rj-kpis{grid-template-columns:repeat(2,1fr)}}
.rj .rj-k{background:#DDEBF7;color:#1F4E79;text-align:center;padding:8px 6px}
.rj .rj-k span{display:block;font-size:10.5px;font-weight:700}
.rj .rj-k b{display:block;font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.rj h4{color:#1F4E79;font-size:15px;font-weight:700;margin:0 0 6px}
.rj .rj-tw{overflow-x:auto}
.rj table{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;white-space:nowrap}
.rj th{position:static;background:#1F4E79;color:#fff;font-weight:700;font-size:11.5px;text-transform:none;letter-spacing:0;text-align:center;padding:6px 7px;border:1px solid #B7C9E0}
.rj td{text-align:center;padding:4px 7px;border:1px solid #B7C9E0;color:#222;font-variant-numeric:tabular-nums}
.rj tr.vazia td{color:#999}
.rj tr.tot td{font-weight:700;color:#1F4E79}
.rj .rj-nota{font-size:10.5px;color:#666;margin-top:10px}
.rj td.txt{text-align:left;white-space:normal;min-width:180px}
.rj table.rj-dados td:nth-child(12){min-width:320px}
.rj tr.fds td:nth-child(-n+2){background:#FCE4D6}
.rj tr.ext td{background:#FFF2CC}
.rj td.vbad,.rj .rj-st.bad{color:#9C0006;background:#FFC7CE}
.rj td.vwarn,.rj .rj-st.warn{color:#9C6500;background:#FFEB9C}
.rj .rj-st.ok{color:#006100;background:#C6EFCE}
.rj .rj-st{display:inline-block;padding:1px 6px;font-weight:600}
.rj-abas .btn{padding:6px 10px;font-size:13px}
.rj-quebra{margin-top:16px}
@media print{
  .rj{padding:0;border-radius:0}
  .rj .rj-kpis{grid-template-columns:repeat(6,1fr)}
  .rj table{font-size:9.5px}.rj th{font-size:9px;padding:4px}.rj td{padding:3px 4px}
  .rj th,.rj .rj-k,.rj td,.rj .rj-st{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rj-quebra{break-before:page;margin-top:0}
  .rj td.txt{min-width:0}.rj table.rj-dados td:nth-child(12){min-width:0}
  .rj td{white-space:nowrap}.rj td.txt{white-space:normal}.rj th{white-space:normal}
}
/* ---- ecrãs estreitos: a barra lateral fica como coluna estreita (ícone + nome) ---- */
@media(max-width:980px){
  .side{width:76px;padding:12px 6px;align-items:stretch}
  .brand{justify-content:center;padding:2px 0 12px}
  .brand-mark{width:38px;height:38px}
  .brand-name,.brand-sub,.side-foot{display:none}
  .side .roadline{margin:0 6px 10px;background:repeating-linear-gradient(90deg,var(--amber) 0 8px,transparent 8px 14px)}
  #tabs{gap:1px}
  .nav-item{flex-direction:column;gap:3px;padding:8px 2px 7px;font-size:10px;line-height:1.15;text-align:center;justify-content:center;white-space:normal;letter-spacing:.01em}
  .nav-item svg{width:19px;height:19px}
  .nav-item.on::before{left:0;top:9px;bottom:9px}
  .top{padding:14px 14px 10px}
  h1{font-size:24px}
  h2{font-size:17px}
  main{padding:14px 12px 30px}
  footer{margin:10px 12px 70px}
  .kgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}

<script>
'use strict';
/* ============ CONSTANTES ============ */
const ACTN=['Descanso','Disponibilidade','Outros Trabalhos','Condução'];
const DIAS=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const FERIADOS=['2026-01-01','2026-02-17','2026-04-03','2026-04-05','2026-04-25','2026-05-01','2026-06-04','2026-06-10','2026-08-15','2026-10-05','2026-11-01','2026-12-01','2026-12-08','2026-12-25',
'2025-01-01','2025-03-04','2025-04-18','2025-04-20','2025-04-25','2025-05-01','2025-06-10','2025-06-19','2025-08-15','2025-10-05','2025-11-01','2025-12-01','2025-12-08','2025-12-25'];
const REST_TH=420;            // descanso qualificado que separa turnos: ≥7h contínuas
const LS='tacho_caio_v2';

/* ============ ESTADO ============ */
let RAW=[];                    // ficheiros parseados
let S={espera:{},obs:{},extra:{},km:{},xmeta:{},dest:null,tz:'utc',ctrlHist:[],man:{},bisLim:45*60,
       perfil:{nome:'',ap:'',cartao:'',empresa:'',matricula:'',base:'',contacto:''},
       nuvem:{url:'',key:'',token:'',refresh:'',uid:'',email:'',ultima:0,auto:true,fich:true},
       carim:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
if(!S.man)S.man={};
if(!S.bisLim)S.bisLim=45*60;
if(!S.perfil)S.perfil={nome:'',ap:'',cartao:'',empresa:'',matricula:'',base:'',contacto:''};
if(!S.nuvem)S.nuvem={url:'',key:'',token:'',refresh:'',uid:'',email:'',ultima:0,auto:true,fich:true};
if(!S.contrato)S.contrato={};
if(!S.dest)S.dest=[["Pingo Doce Azambuja","azambuja"],["Santacarnes/Montalva T. Novas","montalva"],["Palmela","palmela"],["Maporal","maporal"],["Valsabor","valsabor"],["Santo Tirso","santo tirso"],["Lidl Torres Novas","lidl torres"],["Pingo Doce Algoz","algoz"],["Chep","chep"],["Stec","stec"],["Milharado","milharado"],["Auchan","auchan"],["Ifico","ifico"],["Domplex","dompl"],["Aldi","aldi"],["Transferências","transfer"]];
const save=()=>{try{S.carim=Date.now();localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};

/* ============ UTIL ============ */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const hm=m=>{m=Math.round(m);const s=m<0?'-':'';m=Math.abs(m);return s+Math.floor(m/60)+':'+pad(m%60)};
const hmm=m=>m==null?'—':hm(m);
const dISO=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const dPT=iso=>iso.split('-').reverse().join('/');
const clk=absMin=>pad(Math.floor(absMin/60)%24)+':'+pad(absMin%60);
/* horário: sempre o que vem do cartão (UTC), sem ajuste de hora de verão */
function tzOff(){return 0}
const L=(abs)=>abs+tzOff(abs); // UTC→local
const U=(loc)=>loc-tzOff(loc); // local→UTC (aprox. na hora da mudança)
function carve(list,a,b){ // remove o intervalo [a,b) da linha temporal
  const out=[];
  for(const s of list){
    if(s.t1<=a||s.t0>=b){out.push(s);continue}
    if(s.t0<a)out.push({...s,t1:a});
    if(s.t1>b)out.push({...s,t0:b});
  }
  return out;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ============ PARSER .DDD/.ESM (Anexo 1B/1C) ============ */
function parseDDD(buf){
  const u=new Uint8Array(buf), dv=new DataView(buf);
  const B={};let i=0;
  while(i+5<=u.length){
    const fid=(u[i]<<8|u[i+1]), app=u[i+2], ln=dv.getUint16(i+3);
    if(i+5+ln>u.length)break;
    if(app===0){(B[fid]=B[fid]||[]).push(buf.slice(i+5,i+5+ln))}
    i+=5+ln;
  }
  const txt=(ab,o,n)=>{let s='';const a=new Uint8Array(ab,o,n);for(const c of a)if(c>=32)s+=String.fromCharCode(c);return s.trim()};
  const t4=(ab,o)=>new DataView(ab).getUint32(o);
  const out={days:[],vehicles:[],places:[],events:[],faults:[],controls:[],ident:null,dl:null,gen:B[0x0501]?(new Uint8Array(B[0x0501][0])[0]>=2?2:1):1};
  if(B[0x0520]){const ab=B[0x0520][0];out.ident={card:txt(ab,1,16),ap:txt(ab,66,35),nome:txt(ab,102,35)}}
  if(B[0x050e])out.dl=t4(B[0x050e][0],0);
  if(B[0x0504]){
    const ab=B[0x0504][0], dv2=new DataView(ab);
    const pOld=dv2.getUint16(0), pNew=dv2.getUint16(2), N=ab.byteLength-4;
    const U8=new Uint8Array(ab);
    const rd=(off,n)=>{off=((off%N)+N)%N;const r=new Uint8Array(n);for(let k=0;k<n;k++)r[k]=U8[4+((off+k)%N)];return r};
    // um registo diário: prevLen(2) recLen(2) data(4) presença(2) distância(2) + mudanças de atividade (2 cada)
    const leDia=off=>{
      const h=rd(off,12), hv=new DataView(h.buffer);
      const prev=hv.getUint16(0), recLen=hv.getUint16(2), ts=hv.getUint32(4), dist=hv.getUint16(10);
      const valido=recLen>=12&&recLen<=12+1440*2&&recLen<=N&&!((recLen-12)&1)&&ts>500000000&&ts<4102444800&&ts%86400===0;
      if(!valido)return {prev,recLen,ok:false};
      const nA=(recLen-12)>>1, raw=rd(off+12,nA*2), ch=[];
      for(let k=0;k<nA;k++){
        const v=raw[2*k]<<8|raw[2*k+1];
        ch.push({t:Math.floor(ts/60)+(v&0x7FF),a:(v>>11)&3,ins:((v>>13)&1)===0});
      }
      return {prev,recLen,ok:true,dia:{ts,dist,ch}};
    };
    const vistos=new Map();
    // 1) do registo mais antigo para a frente
    let off=pOld,guard=0;
    while(N>0&&guard++<3000){
      const r=leDia(off);if(!r.ok)break;
      vistos.set(r.dia.ts,r.dia);
      if(off%N===pNew%N)break;
      off=(off+r.recLen)%N;
    }
    // 2) do registo mais recente para trás (recupera o que um registo estragado a meio tenha cortado)
    off=pNew;guard=0;
    while(N>0&&guard++<3000){
      const r=leDia(off);if(!r.ok)break;
      if(!vistos.has(r.dia.ts))vistos.set(r.dia.ts,r.dia);
      if(off%N===pOld%N||!r.prev)break;
      off=((off-r.prev)%N+N)%N;
    }
    out.days.push(...[...vistos.values()].sort((a,b)=>a.ts-b.ts));
  }
  if(B[0x0505]){
    const ab=B[0x0505][0],n=(ab.byteLength-2)/31|0,dv2=new DataView(ab);
    for(let k=0;k<n;k++){const o=2+k*31,f=dv2.getUint32(o+6);
      if(f>500000000)out.vehicles.push({o1:(dv2.getUint16(o)<<8|new Uint8Array(ab)[o+2]),o2:(dv2.getUint16(o+3)<<8|new Uint8Array(ab)[o+5]),first:f,last:dv2.getUint32(o+10),reg:txt(ab,o+15,14)});}
  }
  if(B[0x0506]){
    const ab=B[0x0506][0],n=(ab.byteLength-1)/10|0,dv2=new DataView(ab),u2=new Uint8Array(ab);
    for(let k=0;k<n;k++){const o=1+k*10,t=dv2.getUint32(o);
      if(t>500000000)out.places.push({t,tipo:u2[o+4],pais:u2[o+5]});}
  }
  const evParse=(fid,arr)=>{if(!B[fid])return;const ab=B[fid][0],n=ab.byteLength/24|0,dv2=new DataView(ab),u2=new Uint8Array(ab);
    for(let k=0;k<n;k++){const o=k*24,b=dv2.getUint32(o+1);
      if(b>500000000)arr.push({tipo:u2[o],ini:b,fim:dv2.getUint32(o+5),reg:txt(ab,o+10,14)});}};
  evParse(0x0502,out.events);evParse(0x0503,out.faults);
  if(B[0x0508]){const ab=B[0x0508][0],u2=new Uint8Array(ab),dv2=new DataView(ab),t=dv2.getUint32(1);
    if(t>500000000)out.controls.push({tipo:u2[0],t,card:txt(ab,6,16),reg:txt(ab,24,14)});}
  return out;
}

/* ============ REGISTOS MANUAIS (discos de tacógrafo) ============ */
/* S.man[iso] = {src,ini,fim,modo:'tot'|'blk',cond,ot,disp,blocos:[{a,ini,fim}]}
   Horas indicadas na hora local escolhida no cabeçalho; convertidas para UTC. */
function manualSegs(){
  const out=[];
  for(const d of Object.keys(S.man||{})){
    const m=S.man[d];if(!m||!m.ini||!m.fim)continue;
    const base=Date.parse(d+'T00:00:00Z')/60000;
    const a=base+parseHM(m.ini);let b=base+parseHM(m.fim);if(b<=a)b+=1440;
    const segs=[];
    const push=(t0,t1,act,est)=>{if(t1>t0)segs.push({t0,t1,a:act,ins:true,man:true,est:!!est,dia:d})};
    if(m.modo==='blk'&&(m.blocos||[]).length){
      const bl=(m.blocos||[]).filter(x=>x.ini&&x.fim).map(x=>{
        let s=base+parseHM(x.ini);while(s<a)s+=1440;
        let e=base+parseHM(x.fim);while(e<=s)e+=1440;
        return {s,e,act:+x.a||0};
      }).sort((x,y)=>x.s-y.s);
      let t=a;
      for(const x of bl){
        const s=Math.max(x.s,t),e=Math.min(x.e,b);
        if(e<=s)continue;
        if(s>t)push(t,s,0,false);
        push(s,e,x.act,false);t=e;
      }
      if(t<b)push(t,b,0,false);
    }else{
      const jorn=b-a;
      const c=Math.min(parseHM(m.cond),jorn);
      const o=Math.min(parseHM(m.ot),jorn-c);
      const dp=Math.min(parseHM(m.disp),jorn-c-o);
      const pa=jorn-c-o-dp;
      const acts=[[3,c],[2,o],[1,dp]].filter(x=>x[1]>0);
      let t=a;
      if(!acts.length)push(a,b,0,true);
      else if(acts.length===1){const h=Math.round(acts[0][1]/2);
        push(t,t+h,acts[0][0],true);t+=h;push(t,t+pa,0,true);t+=pa;push(t,t+(acts[0][1]-h),acts[0][0],true);}
      else{push(t,t+acts[0][1],acts[0][0],true);t+=acts[0][1];push(t,t+pa,0,true);t+=pa;
        for(const [ac,du] of acts.slice(1)){push(t,t+du,ac,true);t+=du}}
    }
    // pausas nas pontas ficam de fora do turno; as internas nunca o dividem
    while(segs.length&&segs[0].a===0)segs.shift();
    while(segs.length&&segs[segs.length-1].a===0)segs.pop();
    for(const s of segs){if(s.a===0)s.nosplit=true;s.t0=U(s.t0);s.t1=U(s.t1)}
    out.push(...segs);
  }
  return out.sort((x,y)=>x.t0-y.t0);
}

/* ============ LEITOR DE CARTÃO (WebUSB + CCID) ============ */
/* Lê o cartão de condutor num leitor USB ligado por OTG e monta um .ddd igual ao
   da descarga normal. Só faz LEITURA: nunca escreve nada no cartão. */
const RD={dev:null,bloqueado:false,nativo:false,io:null,itf:null,epIn:0,epOut:0,seq:0,level:'apdu',proto:1,ns:0,atr:null,busy:false,log:[],ddd:null,nome:''};
const AND=(typeof window!=='undefined'&&window.AndroidUsb)?window.AndroidUsb:null; // app Android
const b64e=b=>{let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s)};
const b64d=s=>{const t=atob(s||'');const b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return b};
const hx=b=>[...b].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
/* barra de progresso da leitura do cartão */
function rprog(){
  const P=RD.prog;if(!P)return;
  const pct=P.total?Math.min(100,Math.round(P.feito/P.total*100)):0;
  const el=$('#rdProg');if(!el)return;
  el.querySelector('i').style.width=pct+'%';
  el.querySelector('.rdPct').textContent=pct+'%';
  el.querySelector('.rdEtapa').textContent=P.etapa||'';
}
function rlog(t,cls){RD.log.push({t,cls:cls||''});const el=$('#rdLog');
  if(el){el.innerHTML=RD.log.map(l=>`<div class="${l.cls}">${esc(l.t)}</div>`).join('');el.scrollTop=el.scrollHeight}}
function u8(x){return x instanceof Uint8Array?x:new Uint8Array(x)}
function cat(a,b){const t=new Uint8Array(a.length+b.length);t.set(a);t.set(b,a.length);return t}

/* ---- ligação ---- */
async function rdOpen(dev){
  await dev.open();
  if(!dev.configuration)await dev.selectConfiguration(dev.configurations[0].configurationValue);
  const cands=[];
  for(const i of dev.configuration.interfaces){
    const a=i.alternate,bulks=a.endpoints.filter(e=>e.type==='bulk');
    if(bulks.length>=2)cands.push({itf:i,cls:a.interfaceClass,bulks});
  }
  if(!cands.length)throw new Error('Este aparelho não tem interface de dados utilizável — não parece ser um leitor de cartões.');
  cands.sort((a,b)=>(a.cls===0x0B?1:0)-(b.cls===0x0B?1:0)); // tenta primeiro as que o Chrome não bloqueia
  let ult=null,bloq=false;
  for(const c of cands){
    try{
      await dev.claimInterface(c.itf.interfaceNumber);
      RD.epIn=c.bulks.find(e=>e.direction==='in').endpointNumber;
      RD.epOut=c.bulks.find(e=>e.direction==='out').endpointNumber;
      RD.dev=dev;RD.itf=c.itf.interfaceNumber;RD.seq=0;RD.nativo=false;
      RD.io={
        out:async b=>{await dev.transferOut(RD.epOut,b)},
        in:async ()=>{const r=await dev.transferIn(RD.epIn,65536);
          return r.data?new Uint8Array(r.data.buffer,r.data.byteOffset,r.data.byteLength):new Uint8Array(0)}
      };
      await rdNivel(dev);
      rlog('Leitor ligado: '+(dev.productName||'sem nome')+(dev.manufacturerName?' ('+dev.manufacturerName+')':''),'ok');
      rlog('Interface '+c.itf.interfaceNumber+', classe 0x'+c.cls.toString(16).toUpperCase().padStart(2,'0')+' · modo '+({apdu:'APDU',tpdu:'TPDU (T=1 feito pela app)',char:'caractere'}[RD.level]||RD.level));
      if(RD.level==='char')rlog('Este leitor trabalha ao nível do caractere e não é suportado.','bad');
      return;
    }catch(e){ult=e;if(c.cls===0x0B)bloq=true}
  }
  if(bloq){
    RD.bloqueado=true;
    throw new Error('O Chrome recusa-se a abrir leitores de smart card a partir de uma página web (classe USB 0x0B está na lista de classes protegidas, desde o Chrome 67). Não é problema teu nem do leitor: nenhuma página web consegue. Vê a alternativa mais abaixo.');
  }
  throw new Error('Não consegui abrir a interface do aparelho'+(ult?' ('+(ult.name||'')+': '+(ult.message||ult)+')':'')+'.');
}
function nivelDe(b){ // lê o descritor CCID: nível de troca suportado pelo leitor
  for(let i=0;i+2<b.length;){
    const len=b[i],type=b[i+1];if(!len)break;
    if(type===0x21&&len>=54){
      const dw=b[i+40]|b[i+41]<<8|b[i+42]<<16|b[i+43]<<24;
      return (dw&0x00060000)?'apdu':((dw&0x00010000)?'tpdu':'char');
    }
    i+=len;
  }
  return 'apdu';
}
async function rdNivel(dev){
  RD.level='apdu';
  try{
    const r=await dev.controlTransferIn({requestType:'standard',recipient:'device',request:0x06,value:0x0200,index:0},1024);
    RD.level=nivelDe(new Uint8Array(r.data.buffer,r.data.byteOffset,r.data.byteLength));
  }catch(e){}
}
/* ---- caminho nativo: app Android (sem as limitações do Chrome) ---- */
function andLista(){
  try{return JSON.parse(AND.list()||'[]')}catch(e){return []}
}
async function andAbrir(id){
  let r;
  try{r=JSON.parse(AND.open(id))}catch(e){throw new Error('O leitor não respondeu ao pedido de abertura.')}
  if(!r.ok)throw new Error(r.erro||'Não consegui abrir o leitor.');
  RD.dev={productName:r.nome};RD.itf=r.itf;RD.seq=0;RD.nativo=true;RD.bloqueado=false;
  RD.io={
    out:async b=>{if(!AND.out(b64e(b)))throw new Error('Falha a enviar dados para o leitor.')},
    in:async ()=>b64d(AND.inp(3000))
  };
  RD.level='apdu';
  try{const d=b64d(AND.descritores());if(d.length)RD.level=nivelDe(d)}catch(e){}
  rlog('Leitor ligado: '+(r.nome||'sem nome'),'ok');
  rlog('Interface '+r.itf+', classe 0x'+(r.cls||0).toString(16).toUpperCase().padStart(2,'0')+' · modo '+({apdu:'APDU',tpdu:'TPDU (T=1 feito pela app)',char:'caractere'}[RD.level]||RD.level)+' · acesso nativo');
}
async function rdClose(){
  try{
    if(RD.dev){await ccid(0x63)}
    if(RD.nativo)AND.close();
    else if(RD.dev){await RD.dev.releaseInterface(RD.itf);await RD.dev.close()}
  }catch(e){}
  RD.dev=null;RD.io=null;RD.nativo=false;rlog('Leitor desligado.');
}

/* ---- CCID ---- */
async function ccid(tipo,dados,p){
  const d=dados||new Uint8Array(0),n=d.length,pr=p||[0,0,0];
  const b=new Uint8Array(10+n);
  b[0]=tipo;b[1]=n&255;b[2]=(n>>8)&255;b[3]=(n>>16)&255;b[4]=(n>>24)&255;
  b[5]=0;b[6]=RD.seq=(RD.seq+1)&255;b[7]=pr[0];b[8]=pr[1];b[9]=pr[2];
  b.set(d,10);
  await RD.io.out(b);
  for(let volta=0;volta<60;volta++){
    const h=await RD.io.in();
    if(!h||h.length<10)continue;
    const len=h[1]|h[2]<<8|h[3]<<16|h[4]<<24, st=h[7];
    if((st&0xC0)===0x80){await new Promise(s=>setTimeout(s,60));continue} // leitor pediu mais tempo
    if((st&0xC0)===0x40)throw new Error('O leitor devolveu erro (0x'+h[8].toString(16)+'). O cartão está bem encaixado?');
    let out=h.slice(10,10+len);
    while(out.length<len)out=cat(out,await RD.io.in());
    return out.slice(0,len);
  }
  throw new Error('O leitor não respondeu.');
}
async function ccidLigaCartao(){
  let erro=null;
  for(const v of [0x00,0x01,0x02,0x03]){
    try{const atr=await ccid(0x62,null,[v,0,0]);if(atr&&atr.length){RD.atr=atr;return atr}}
    catch(e){erro=e}
  }
  throw erro||new Error('Não consegui ligar o cartão. Verifica se está inserido com o chip para dentro.');
}
function atrProto(atr){ // 0 ou 1
  if(!atr||atr.length<2)return 1;
  let i=1,y=atr[1]>>4,proto=0,primeiro=true;
  while(true){
    if(y&1)i++;if(y&2)i++;if(y&4)i++;
    if(y&8){i++;if(i>=atr.length)break;if(primeiro){proto=atr[i]&0x0F;primeiro=false}y=atr[i]>>4}
    else break;
  }
  return proto;
}

/* ---- T=1 (para leitores que trabalham ao nível do TPDU) ---- */
function lrc(b){let x=0;for(const v of b)x^=v;return x}
function t1Bloco(pcb,inf){
  const d=inf||new Uint8Array(0);
  const b=new Uint8Array(4+d.length);
  b[0]=0x00;b[1]=pcb;b[2]=d.length;b.set(d,3);b[3+d.length]=lrc(b.slice(0,3+d.length));
  return b;
}
async function t1Troca(cmd){
  let resp=new Uint8Array(0);
  let r=await ccid(0x6F,t1Bloco(RD.ns?0x40:0x00,cmd));
  RD.ns^=1;
  let nr=0,guarda=0;
  while(guarda++<300){
    if(!r||r.length<4)throw new Error('Bloco T=1 inválido vindo do cartão.');
    const pcb=r[1],len=r[2],inf=r.slice(3,3+len);
    if((pcb&0x80)===0){                       // bloco I
      resp=cat(resp,inf);
      nr=(pcb&0x40)?1:0;
      if(pcb&0x20){                            // há mais para vir
        r=await ccid(0x6F,t1Bloco(0x80|((nr^1)<<4)));continue;
      }
      return resp;
    }
    if((pcb&0xC0)===0xC0){                     // bloco S
      if((pcb&0x3F)===0x03){r=await ccid(0x6F,t1Bloco(0xE3,inf));continue}   // pedido de mais tempo
      if((pcb&0x3F)===0x01){r=await ccid(0x6F,t1Bloco(0xE1,inf));continue}   // pedido de IFS
      throw new Error('O cartão pediu uma operação T=1 não suportada.');
    }
    r=await ccid(0x6F,t1Bloco(0x80|(nr<<4)));  // bloco R: repetir
  }
  throw new Error('Troca T=1 sem fim à vista.');
}

/* ---- APDU ---- */
async function apdu(cmd){
  const raw=(RD.level==='tpdu'&&RD.proto===1)?await t1Troca(cmd):await ccid(0x6F,cmd);
  if(!raw||raw.length<2)throw new Error('Resposta inválida do cartão.');
  const sw1=raw[raw.length-2],sw2=raw[raw.length-1];
  let dados=raw.slice(0,-2);
  if(sw1===0x6C&&cmd.length>=5){const c=Uint8Array.from(cmd);c[4]=sw2;return apdu(c)}
  if(sw1===0x61){
    const r2=await apdu(new Uint8Array([0x00,0xC0,0x00,0x00,sw2]));
    return {dados:cat(dados,r2.dados),sw:r2.sw};
  }
  return {dados,sw:(sw1<<8)|sw2};
}
const AID=[0xFF,0x54,0x41,0x43,0x48,0x4F]; // aplicação tacógrafo (1.ª geração)
async function selApp(){
  for(const p2 of [0x0C,0x00]){
    const r=await apdu(new Uint8Array([0x00,0xA4,0x04,p2,0x06,...AID]));
    if(r.sw===0x9000)return true;
  }
  return false;
}
async function selEF(fid){
  for(const p2 of [0x0C,0x00]){
    const r=await apdu(new Uint8Array([0x00,0xA4,0x02,p2,0x02,fid>>8,fid&255]));
    if(r.sw===0x9000)return true;
  }
  return false;
}
async function lerEF(max,prog){
  let out=new Uint8Array(0),off=0;
  while(off<32767){
    const n=max?Math.min(255,max-off):255;
    if(n<=0)break;
    const r=await apdu(new Uint8Array([0x00,0xB0,(off>>8)&0x7F,off&255,n===256?0:n]));
    if(r.sw===0x9000){
      if(!r.dados.length)break;
      out=cat(out,r.dados);off+=r.dados.length;
      if(prog)prog(r.dados.length);
      if(r.dados.length<n)break;
    }else if(r.sw===0x6B00||r.sw===0x6282||r.sw===0x6A82||r.sw===0x6700)break;
    else throw new Error('READ BINARY devolveu 0x'+r.sw.toString(16).toUpperCase());
  }
  return out;
}
async function assinaturaSo(){ // PSO: calcular assinatura (o hash já foi feito)
  const s=await apdu(new Uint8Array([0x00,0x2A,0x9E,0x9A,0x80]));
  return (s.sw===0x9000&&s.dados.length)?s.dados:null;
}
async function assinatura(){ // hash do ficheiro + assinatura
  const h=await apdu(new Uint8Array([0x80,0x2A,0x90,0x00]));
  if(h.sw!==0x9000)return null;
  return assinaturaSo();
}
/* ficheiros da 1.ª geração: [FID, tamanho fixo (0 = descobrir), assinado, nome] */
const EFS=[
  [0x0002,25,0,'ICC'],[0x0005,8,0,'IC'],
  [0xC100,194,0,'Certificado do cartão'],[0xC108,194,0,'Certificado da autoridade'],
  [0x0501,10,1,'Identificação da aplicação'],[0x0520,143,1,'Identificação do condutor'],
  [0x050E,4,1,'Data da última descarga'],[0x0521,53,1,'Carta de condução'],
  [0x0502,0,1,'Eventos'],[0x0503,0,1,'Avarias'],[0x0504,0,1,'Atividades'],
  [0x0505,0,1,'Veículos utilizados'],[0x0506,0,1,'Locais'],
  [0x0507,19,1,'Utilização atual'],[0x0508,46,1,'Controlos'],[0x0522,0,1,'Condições específicas']
];
function tlv(fid,app,dados){
  const b=new Uint8Array(5+dados.length);
  b[0]=fid>>8;b[1]=fid&255;b[2]=app;b[3]=dados.length>>8;b[4]=dados.length&255;
  b.set(dados,5);return b;
}
async function rdLerCartao(){
  RD.busy=true;RD.prog={feito:0,total:1,etapa:'A ligar o cartão…'};render();
  try{
    rlog('A ligar o cartão…');
    const atr=await ccidLigaCartao();
    RD.proto=atrProto(atr);RD.ns=0;
    rlog('ATR: '+hx(atr));
    rlog('Protocolo do cartão: T='+RD.proto);
    if(!await selApp())throw new Error('Não encontrei a aplicação de tacógrafo neste cartão. É mesmo um cartão de condutor?');
    rlog('Aplicação de tacógrafo selecionada.','ok');
    let ficheiro=new Uint8Array(0),tam={},semAss=0;
    // estimativa até se saber o tamanho real (vem no ficheiro 0501); depois é exata
    const EST={0x0502:1728,0x0503:1152,0x0504:13780,0x0505:6202,0x0506:1121,0x0522:562};
    const tamDe=(fid,fixo)=>fixo||tam[fid]||EST[fid]||200;
    const feitos=new Set();
    const total=()=>EFS.reduce((s,[f,fx])=>s+tamDe(f,fx),0);
    Object.assign(RD.prog,{feito:0,total:total(),etapa:'A ler o cartão…'});rprog();
    for(const [fid,fixo,ass,nome] of EFS){
      RD.prog.etapa='A ler: '+nome;RD.prog.total=total();rprog();
      const antes=RD.prog.feito;
      const fecha=()=>{feitos.add(fid);RD.prog.feito=antes+tamDe(fid,fixo);rprog()};
      if(!await selEF(fid)){rlog('· '+nome+': não existe no cartão','dim');fecha();continue}
      let hashOk=false;
      if(ass){try{hashOk=(await apdu(new Uint8Array([0x80,0x2A,0x90,0x00]))).sw===0x9000}catch(e){}}
      const dados=await lerEF(fixo||tam[fid]||0,n=>{RD.prog.feito=Math.min(RD.prog.feito+n,antes+tamDe(fid,fixo));rprog()});
      if(!dados.length){rlog('· '+nome+': vazio','dim');fecha();continue}
      ficheiro=cat(ficheiro,tlv(fid,0,dados));
      rlog('· '+nome+': '+dados.length+' bytes','ok');
      if(fid===0x0501&&dados.length>=10){ // dimensões dos ficheiros variáveis
        tam[0x0502]=dados[3]*6*24;tam[0x0503]=dados[4]*2*24;
        tam[0x0504]=4+(dados[5]<<8|dados[6]); // 2 ponteiros (4 bytes) + buffer circular de atividades
        tam[0x0505]=2+(dados[7]<<8|dados[8])*31;tam[0x0506]=1+dados[9]*10;
      }
      if(ass){
        let sig=null;
        try{sig=hashOk?await assinaturaSo():await assinatura()}catch(e){}
        if(sig)ficheiro=cat(ficheiro,tlv(fid,1,sig));else semAss++;
      }
      fecha();
      await new Promise(s=>setTimeout(s,0));
    }
    if(!ficheiro.length)throw new Error('Não saiu nada do cartão.');
    if(semAss)rlog(semAss+' ficheiro(s) sem assinatura digital — os dados estão cá, mas este .ddd não serve como cópia oficial.','warn');
    RD.ddd=ficheiro;
    const p=parseDDD(ficheiro.buffer.slice(ficheiro.byteOffset,ficheiro.byteOffset+ficheiro.byteLength));
    RD.nome=p.ident?((p.ident.nome+'_'+p.ident.ap).replace(/[^A-Za-z0-9_]/g,'')||'cartao'):'cartao';
    RAW.push(p);
    try{await IDB.set('leitor_'+Date.now(),ficheiro.buffer.slice(0))}catch(e){}
    const d0=p.days.length?dPT(dISO(new Date(p.days[0].ts*1000))):'—', d1=p.days.length?dPT(dISO(new Date(p.days[p.days.length-1].ts*1000))):'—';
    rlog('Leitura completa: '+ficheiro.length+' bytes, '+p.days.length+' dias de atividade ('+d0+' a '+d1+').','ok');
    RD.prog={feito:1,total:1,etapa:'Concluído — '+p.days.length+' dias lidos, de '+d0+' a '+d1,fim:true};
    RD.busy=false;rebuild();
  }catch(e){
    if(RD.prog)RD.prog.etapa='Falhou: '+e.message;
    rlog('Falhou: '+e.message,'bad');RD.busy=false;render();
  }
}

/* ============ CONTA E SINCRONIZAÇÃO (Supabase via REST, sem bibliotecas) ============ */
/* O telemóvel manda sempre: os dados vivem aqui e a nuvem é uma cópia.
   Sem ligação, a app funciona na mesma — a sincronização fica para quando houver rede. */
const NV={estado:'',ocupado:false};
const nvOk=()=>!!(S.nuvem.url&&S.nuvem.key);
const nvLig=()=>nvOk()&&!!S.nuvem.token;
function nvEstado(t,cls){NV.estado=t;NV.cls=cls||'';const el=$('#nvLog');if(el){el.textContent=t;el.className='note '+(cls||'')}}
async function sb(caminho,opt,semAuth){
  if(!nvOk())throw new Error('Falta a ligação à nuvem (endereço e chave do projeto).');
  const o=opt||{};o.headers=Object.assign({'apikey':S.nuvem.key,'Content-Type':'application/json'},o.headers||{});
  if(!semAuth&&S.nuvem.token)o.headers['Authorization']='Bearer '+S.nuvem.token;
  let r=await fetch(S.nuvem.url.replace(/\/+$/,'')+caminho,o);
  if(r.status===401&&!semAuth&&S.nuvem.refresh){
    if(await nvRenova()){o.headers['Authorization']='Bearer '+S.nuvem.token;r=await fetch(S.nuvem.url.replace(/\/+$/,'')+caminho,o)}
  }
  return r;
}
async function nvRenova(){
  try{
    const r=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:S.nuvem.refresh})},true);
    if(!r.ok)return false;
    const j=await r.json();S.nuvem.token=j.access_token;S.nuvem.refresh=j.refresh_token;save();return true;
  }catch(e){return false}
}
function nvGuardaSessao(j){
  S.nuvem.token=j.access_token||'';S.nuvem.refresh=j.refresh_token||'';
  S.nuvem.uid=(j.user&&j.user.id)||S.nuvem.uid;S.nuvem.email=(j.user&&j.user.email)||S.nuvem.email;
  save();
}
async function nvEntrar(email,pass){
  const r=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pass})},true);
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Não consegui entrar.');
  nvGuardaSessao(j);
}
async function nvCriar(email,pass){
  const r=await sb('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password:pass})},true);
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Não consegui criar a conta.');
  if(j.access_token)nvGuardaSessao(j);
  return !j.access_token; // true = falta confirmar o email
}
async function nvRecuperar(email){

  if(!r.ok)throw new Error('Não consegui enviar o email de recuperação.');
}
function nvSair(){
  S.nuvem.token='';S.nuvem.refresh='';S.nuvem.uid='';S.nuvem.email='';S.nuvem.ultima=0;save();
  nvEstado('Sessão terminada. Os dados continuam guardados neste aparelho.');
}
/* ---- junção de dois estados: o mais recente ganha nos conflitos ---- */
function nvJunta(loc,rem,remNovo){
  const out=JSON.parse(JSON.stringify(loc));
  const dicts=['espera','obs','extra','km','xmeta','man'];
  for(const d of dicts){
    out[d]=out[d]||{};const r=(rem&&rem[d])||{};
    for(const k of Object.keys(r)) if(!(k in out[d])||remNovo) out[d][k]=r[k];
  }
  if(rem&&Array.isArray(rem.dest)){
    const vistos=new Set((out.dest||[]).map(x=>JSON.stringify(x)));
    out.dest=(out.dest||[]).concat(rem.dest.filter(x=>!vistos.has(JSON.stringify(x))));
  }
  if(rem&&Array.isArray(rem.ctrlHist)){
    const vistos=new Set((out.ctrlHist||[]).map(x=>JSON.stringify(x)));
    out.ctrlHist=(out.ctrlHist||[]).concat(rem.ctrlHist.filter(x=>!vistos.has(JSON.stringify(x))));
  }
  if(remNovo&&rem){
    if(rem.perfil)out.perfil=Object.assign({},out.perfil,rem.perfil);
    if(rem.contrato)out.contrato=Object.assign({},out.contrato,rem.contrato);
    if(rem.tz)out.tz=rem.tz;
    if(rem.bisLim)out.bisLim=rem.bisLim;
  }else if(rem&&rem.perfil){
    for(const k of Object.keys(rem.perfil)) if(!out.perfil[k]) out.perfil[k]=rem.perfil[k];
  }
  return out;
}
/* Restaurar um backup JUNTA-O ao que já existe: o que já está preenchido neste aparelho fica
   sempre; o backup só preenche o que falta. Nada é apagado nem substituído. */
function restauraBackup(b){
  const cont=k=>Object.keys((b&&b[k])||{}).length;
  const n={obs:cont('obs'),extra:cont('extra'),xmeta:cont('xmeta'),man:cont('man'),km:cont('km'),espera:cont('espera')};
  const junto=nvJunta(estadoLocal(),b||{},false);
  // contrato/salário: se ainda não foi definido aqui, vem do backup
  if(b&&b.contrato&&!Object.keys(S.contrato||{}).length)junto.contrato=b.contrato;
  Object.assign(S,junto);save();rebuild();
  return n;
}
function estadoLocal(){
  return {espera:S.espera,obs:S.obs,extra:S.extra,km:S.km,xmeta:S.xmeta,dest:S.dest,
          tz:S.tz,ctrlHist:S.ctrlHist,man:S.man,bisLim:S.bisLim,perfil:S.perfil,contrato:S.contrato,carim:S.carim||0};
}
async function nvSincroniza(){
  if(NV.ocupado)return;
  if(!nvLig()){nvEstado('Entra na conta para sincronizar.','bad');return}
  NV.ocupado=true;render();
  try{
    nvEstado('A sincronizar…');
    const r=await sb('/rest/v1/dados?select=*&user_id=eq.'+encodeURIComponent(S.nuvem.uid),{method:'GET'});
    if(!r.ok)throw new Error('A nuvem respondeu '+r.status+' — verifica se criaste as tabelas.');
    const linhas=await r.json();
    const remoto=linhas[0]?linhas[0].estado:null;
    const remCar=linhas[0]?(linhas[0].carimbo||0):0;
    const junto=nvJunta(estadoLocal(),remoto,remCar>(S.carim||0));
    Object.assign(S,junto);
    S.carim=Date.now();
    const corpo={user_id:S.nuvem.uid,estado:estadoLocal(),carimbo:S.carim,atualizado:new Date().toISOString()};
    const w=await sb('/rest/v1/dados',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(corpo)});
    if(!w.ok){const t=await w.text();throw new Error('Não consegui gravar na nuvem: '+t.slice(0,120))}
    let nf=0;
    if(S.nuvem.fich)nf=await nvFicheiros();
    S.nuvem.ultima=Date.now();save();
    nvEstado('Sincronizado às '+new Date().toLocaleTimeString('pt-PT').slice(0,5)+(nf?' · '+nf+' ficheiro(s) trazidos da nuvem':''),'ok');
    NV.ocupado=false;rebuild();
  }catch(e){
    NV.ocupado=false;nvEstado('Falhou: '+(e.message||e),'bad');render();
  }
}
/* ---- ficheiros do cartão (.ddd) no armazenamento da conta ---- */
async function nvFicheiros(){
  const base='/storage/v1/object';
  const pasta=S.nuvem.uid;
  const locais=await IDB.chaves();
  const r=await sb('/storage/v1/object/list/cartoes',{method:'POST',body:JSON.stringify({prefix:pasta+'/',limit:1000})});
  const remotos=r.ok?(await r.json()).map(o=>o.name):[];
  for(const k of locais){
    if(remotos.includes(k))continue;
    const ab=await IDB.get(k);
    if(!ab)continue;
    await sb(base+'/cartoes/'+encodeURIComponent(pasta)+'/'+encodeURIComponent(k),
      {method:'POST',headers:{'Content-Type':'application/octet-stream','x-upsert':'true'},body:ab});
  }
  let trazidos=0;
  for(const k of remotos){
    if(locais.includes(k))continue;
    const g=await sb(base+'/cartoes/'+encodeURIComponent(pasta)+'/'+encodeURIComponent(k),{method:'GET'});
    if(!g.ok)continue;
    const ab=await g.arrayBuffer();
    try{RAW.push(parseDDD(ab));await IDB.set(k,ab);trazidos++}catch(e){}
  }
  return trazidos;
}

/* ============ CONTRATO E CÁLCULO DO SALÁRIO ============ */
/* O perfil de trabalho do motorista: escala, horas normais e valores.
   A app compara cada dia com o que estava previsto e diz o que é extra e quanto vale. */
const CONTRATO_BASE={
  escala:[1,1,1,1,1,0,0],        // seg,ter,qua,qui,sex,sáb,dom — 1 = dia previsto
  turno:'diurno',
  horasDia:8*60, horasSemana:40*60,
  base:'trab',                    // 'trab' = Cond+OT+Disp · 'jornada' = porta a porta
  noiteIni:'22:00', noiteFim:'07:00',
  noiteAviso:false,               // avisar turnos com trabalho noturno e > 10h de trabalho
  ampMax:13*60,                   // amplitude máxima de trabalho pretendida (início → fim do turno)
  ordenado:0, valorHora:0, divisor:173.33, normaisNoOrdenado:true,
  acr:{extra1:25, extraN:37.5, descanso:50, feriado:50, noturno:25},
  fixos:{pernoita:{v:0,regra:'meianoite'}, ajudas:{v:0,regra:'dia'}, premio:{v:0,regra:'mes'}}
};
function C(){ // contrato com os valores em falta preenchidos
  const c=Object.assign({},CONTRATO_BASE,S.contrato||{});
  c.acr=Object.assign({},CONTRATO_BASE.acr,(S.contrato||{}).acr||{});
  c.fixos=Object.assign({},CONTRATO_BASE.fixos,(S.contrato||{}).fixos||{});
  c.escala=((S.contrato||{}).escala||CONTRATO_BASE.escala).slice();
  return c;
}
function valorHora(){
  const c=C();
  if(c.valorHora>0)return c.valorHora;
  if(c.ordenado>0&&c.divisor>0)return c.ordenado/c.divisor;
  return 0;
}
function minNoturnos(r){ // minutos do turno dentro da janela noturna
  const c=C(), ni=parseHM(c.noiteIni), nf=parseHM(c.noiteFim);
  let tot=0;
  for(const s of (r.segs||[])){
    if(s.a===0)continue;                        // pausa não é trabalho
    for(let d=-1;d<=1;d++){
      const base=Math.floor(L(s.t0)/1440)*1440+d*1440;
      let a=base+ni, b=base+nf; if(b<=a)b+=1440;
      tot+=Math.max(0,Math.min(L(s.t1),b)-Math.max(L(s.t0),a));
    }
  }
  return Math.round(tot);
}
function diaSalario(r){
  const c=C(), vh=valorHora();
  const dow=(new Date(r.stl*60000).getUTCDay()+6)%7;   // 0 = segunda
  const base=c.base==='jornada'?r.jornada:r.trabalho;
  const feriado=FERIADOS.includes(r.iso);
  const previsto=!!c.escala[dow];
  const tipo=feriado?'Feriado':(previsto?'Escala':'Fora de escala');
  const not=minNoturnos(r);
  let normais=0,e1=0,eN=0,desc=0,fer=0;
  if(feriado)fer=base;
  else if(!previsto)desc=base;
  else{normais=Math.min(base,c.horasDia);
    const sobra=Math.max(0,base-c.horasDia);
    e1=Math.min(sobra,60); eN=Math.max(0,sobra-60);}

/* ============ MOTOR: linha temporal global → turnos ============ */
let SEGS=[],SHIFTS=[],ROWS=[],RESTS=[],WEEKS=[],MONTHS={},BIPER=[],IDENT=null,DL=null,VEHS=[],CTRLS=[],EVTS=[],REINT=[];

    if(f.dl&&(!DL||f.dl>DL))DL=f.dl;
    VEHS.push(...f.vehicles);CTRLS.push(...f.controls);EVTS.push(...f.events.map(e=>({...e,fault:false})),...f.faults.map(e=>({...e,fault:true})));

  SEGS=[];
  for(let j=0;j<ev.length;j++){
    const end=j+1<ev.length?ev[j+1].t:ev[j].t;
    if(end>ev[j].t)SEGS.push({t0:ev[j].t,t1:end,a:ev[j].a,ins:ev[j].ins});
  }

  // funde segmentos contíguos com a mesma atividade e o mesmo estado do cartão
  // (ex.: período noturno cortado pela meia-noite)
  {const M=[];for(const s of SEGS){const p=M[M.length-1];
    if(p&&p.a===s.a&&p.ins===s.ins&&p.t1===s.t0)p.t1=s.t1;else M.push(s)}SEGS=M}
  // dias inseridos manualmente (discos): sobrepõem-se ao que existir na mesma hora
  const MSEG=manualSegs();
  if(MSEG.length){
    for(const m of MSEG)SEGS=carve(SEGS,m.t0,m.t1);
    SEGS=SEGS.concat(MSEG).sort((x,y)=>x.t0-y.t0);
  }
  // preencher buracos da linha temporal com descanso (dias sem cartão nem registo)
  {const F=[];for(const s of SEGS){const p=F[F.length-1];
    if(p&&s.t0>p.t1)F.push({t0:p.t1,t1:s.t0,a:0,ins:false});F.push(s)}SEGS=F}
  {const M=[];for(const s of SEGS){const p=M[M.length-1];
    if(p&&p.a===s.a&&p.ins===s.ins&&!!p.man===!!s.man&&!!p.est===!!s.est&&!!p.nosplit===!!s.nosplit&&p.t1===s.t0)p.t1=s.t1;else M.push(s)}SEGS=M}
  REINT=[];
  for(const s of SEGS){
    if(!s.ins&&s.a!==0&&s.t1-s.t0>=REST_TH){REINT.push({t0:s.t0,t1:s.t1,a:s.a});s.a=0}
  }
  // turnos
  SHIFTS=[];let cur=null,j=0;
  while(j<SEGS.length){
    const s=SEGS[j];
    if(s.a===0){
      let k=j,e=s.t1,ns=!!s.nosplit;
      while(k+1<SEGS.length&&SEGS[k+1].a===0){k++;e=SEGS[k].t1;ns=ns||!!SEGS[k].nosplit}
      if(e-s.t0>=REST_TH&&!ns){if(cur){SHIFTS.push(cur);cur=null}}
      else if(cur)cur.segs.push({t0:s.t0,t1:e,a:0,ins:s.ins});

      cond:tot[3],ot:tot[2],disp:tot[1],pausa:tot[0]-esp,esp,
      trabalho:tot[3]+tot[2]+tot[1], jornada:en-st, km:S.km[iso]??km,
      obs:S.obs[iso]||'', extra:!!S.extra[iso], segs:sh.segs,

  // O período de 24h começa no fim do descanso anterior, ou seja, no início do turno.
  // O descanso diário tem de estar COMPLETO dentro dessas 24h:
  //   11h dentro das 24h  → regular  (a jornada não pode passar das 13h)
  //   3h de pausa no turno + 9h a seguir → regular fracionado (art. 4.º g)
  //   9h dentro das 24h   → reduzido  (jornada até 15h, máx. 3 entre semanais)
  //   menos de 9h         → infração
  RESTS=[];
  for(let k=0;k<ROWS.length-1;k++){
    const A=ROWS[k],B=ROWS[k+1];
    const dur=B.st-A.en;                       // descanso real entre turnos
    const amp=A.en-A.st;                       // amplitude da jornada
    const jan=A.st+1440;                       // fim do período de 24h
    const dentro=Math.max(0,Math.min(B.st,jan)-A.en); // descanso gozado dentro das 24h
    RESTS.push({iso:A.iso,fim:A.en,ini:B.st,dur,amp,jan,dentro,pausaMax:maiorPausa(A),est:!!A.est});
  }
  let red=0,lastWkEnd=null;
  for(const r of RESTS){
    r.frac=false;r.weekly=false;

    else if(r.dur>=24*60){r.status='SEMANAL REDUZIDO';r.falta=45*60-r.dur;red=0;r.weekly=true}
    else if(r.dentro>=11*60){r.status='DIÁRIO REGULAR'}

    else if(r.dentro>=9*60){r.status='DIÁRIO REDUZIDO';r.fracDuvida=r.est&&r.pausaMax>=3*60;red++}

    r.red=red;r.max3=red<=3?'OK':'EXCEDIDO';
    if(r.weekly){r.gap144=lastWkEnd!=null?(ROWS.find(x=>x.en>lastWkEnd)?.st??r.fim)-lastWkEnd:null;

  const surplus=RESTS.map(r=>r.dur>=24*60?r.dur-24*60:(r.dur>=11*60?r.dur-11*60:0)).slice();
  for(let a=0;a<RESTS.length;a++){
    const r=RESTS[a];

    }
    const dld=new Date(L(dl)*60000);

  }

  const LIMB=S.bisLim||45*60;
  BIPER=[];
  {let p=null;
   for(let k=0;k<ROWS.length;k++){
     const r=ROWS[k];
     if(!p){p={ini:r.st,iniIso:r.iso,rows:[],cond:0,trab:0,jorn:0,km:0,aberto:true,fecho:null};BIPER.push(p)}

    const sum=f=>w.rows.reduce((s,r)=>s+f(r),0);

    w.esp=sum(r=>r.esp);w.pausa=sum(r=>r.pausa);w.jorn=sum(r=>r.jornada);w.km=sum(r=>r.km);
    w.trab=w.cond+w.ot+w.disp;

/* ============ ALERTAS ============ */
function maiorPausa(r){ // maior pausa contínua dentro do turno (conta para o descanso fracionado 3h+9h)
  let best=0,run=0,fim=-1;
  for(const s of (r.segs||[])){
    if(s.a===0){run=(s.t0===fim?run:0)+(s.t1-s.t0);fim=s.t1;if(run>best)best=run}
    else{run=0;fim=-1}
  }
  return best;
}
function condContinua(){ // art. 7.º: pausa de 45 min ou dividida em ≥15 + ≥30 (por esta ordem)
  // funde segmentos consecutivos da mesma atividade (ex.: descanso cortado pela meia-noite)
  const M=[];for(const s of SEGS){const p=M[M.length-1];
    if(p&&p.a===s.a&&p.t1===s.t0&&!!p.est===!!s.est)p.t1=s.t1;else M.push({t0:s.t0,t1:s.t1,a:s.a,est:!!s.est});}
  const out=[];let acc=0,first=false;
  for(const s of M){
    const d=s.t1-s.t0;
    // dias manuais em modo "totais" não têm a distribuição real das pausas: não são avaliados
    if(s.est){acc=0;first=false;continue}
    if(s.a===3){acc+=d;if(acc>270){out.push({t:s.t1,dur:acc});acc=0;first=false}}
    else if(s.a===0){ // só o descanso/pausa conta como pausa (a disponibilidade não)
      if(d>=45){acc=0;first=false}
      else if(d>=30&&first){acc=0;first=false}
      else if(d>=15&&!first)first=true;
    }
  }
  return out;
}

  }
  const wk=RESTS.filter(r=>r.weekly);
  for(let k=1;k<wk.length;k++){const gap=wk[k].fim-wk[k-1].ini;
    if(gap>144*60)add('MUITO_GRAVE',wk[k].iso,'dia','Novo descanso semanal iniciado '+hm(gap)+' após o fim do anterior (> 144h / 6×24h)','Reg. 561/2006, art. 8.º/6');}
  for(const c of condContinua())add('GRAVE',dISO(new Date(L(c.t)*60000)),'dia','Condução contínua '+hm(c.dur)+' sem pausa de 45 min','Reg. 561/2006, art. 7.º');
  for(const x of REINT)add('LEVE',dISO(new Date(L(x.t0)*60000)),'dia','Cartão retirado durante '+hm(x.t1-x.t0)+' registado como '+ACTN[x.a].toLowerCase()+' — tratado como descanso na análise (verifica a entrada manual)','Reg. 165/2014, art. 34.º');
  if(DL){const dias=Math.floor(Date.now()/86400000-DL/86400);
    if(dias>28)add('GRAVE',dISO(new Date(DL*1000)),'geral','Última descarga do cartão há '+dias+' dias (prazo: 28)','Reg. (UE) 165/2014, art. 33.º');}
  return A;
}
const GRAU={MAXIMA:0,MUITO_GRAVE:1,GRAVE:2,LEVE:3};
function pior(list){return list.reduce((p,a)=>GRAU[a.g]<GRAU[p]?a.g:p,'LEVE')}
/* análise dia a dia: um registo por dia civil 00:00–24:00 */
function diasAnalise(ini,fim){
  const A=buildAlerts();
  const byDay={},byWeek={},geral=[];
  for(const a of A){
    if(a.scope==='dia')(byDay[a.iso]=byDay[a.iso]||[]).push(a);
    else if(a.scope==='semana')(byWeek[a.iso]=byWeek[a.iso]||[]).push(a);
    else geral.push(a);
  }
  const rmap={};ROWS.forEach(r=>rmap[r.iso]=r);
  const restMap={};RESTS.forEach(r=>{if(r.dur>=24*60)restMap[r.iso]=r});
  const out=[];
  let d=new Date(ini+'T00:00:00Z');const end=new Date(fim+'T00:00:00Z');
  while(d<=end){
    const iso=dISO(d);
    out.push({iso,dia:DIAS[d.getUTCDay()],r:rmap[iso]||null,al:byDay[iso]||[]});
    d.setUTCDate(d.getUTCDate()+1);
  }
  return {dias:out.reverse(),byWeek,geral};
}
function diaLinha(x){
  const worst=x.al.length?pior(x.al):null;
  const tagW=worst?`<span class="tag ${worst==='LEVE'?'warn':'bad'}">${worst.replace('_',' ').replace('MAXIMA','MÁXIMA')}</span>`:(x.r?'<span class="tag ok">OK</span>':'<span class="tag dim">DESCANSO</span>');

function strip(segs,st,en){
  const day0=Math.floor(L(st)/1440)*1440;let html='<div class="strip" title="00:00 → 24:00">',pos=0;
  const push=(w,cls)=>{if(w>0)html+=`<i class="${cls}" style="width:${(w/1440*100).toFixed(2)}%"></i>`};
  const cl=['sR','sA','sW','sD'];
  for(const g of segs){
    const a=Math.max(L(g.t0)-day0,0),b=Math.min(L(g.t1)-day0,1440);
    if(b<=pos)continue;
    push(a-pos,'sO');push(b-Math.max(a,pos),cl[g.a]);pos=b;
    if(pos>=1440)break;
  }
  push(1440-pos,'sO');return html+'</div>';
}

function novoDraft(){return {d:'',src:'Disco',ini:'',fim:'',modo:'tot',cond:'',ot:'',disp:'',km:'',obs:'',blocos:[]}}
let MDRAFT=novoDraft();
function manJorn(m){let a=parseHM(m.ini),b=parseHM(m.fim);if(b<=a)b+=1440;return b-a}
function manCond(m){
  if(m.modo==='blk')return (m.blocos||[]).reduce((s,x)=>{if(+x.a!==3||!x.ini||!x.fim)return s;let a=parseHM(x.ini),b=parseHM(x.fim);if(b<=a)b+=1440;return s+(b-a)},0);
  return parseHM(m.cond);
}
/* ============ FOTOS DOS DISCOS — pasta própria (IndexedDB 'tacho_fotos') ============ */
const FDB={
  db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((ok,ko)=>{const r=indexedDB.open('tacho_fotos',1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'id'});if(!d.objectStoreNames.contains('img'))d.createObjectStore('img')};
    r.onsuccess=()=>{this.db=r.result;ok(r.result)};r.onerror=()=>ko(r.error)})},
  async lista(){const db=await this.open();return new Promise((ok,ko)=>{const q=db.transaction('meta').objectStore('meta').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ko(q.error)})},
  async img(id){const db=await this.open();return new Promise((ok,ko)=>{const q=db.transaction('img').objectStore('img').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})},
  async put(meta,img){const db=await this.open();return new Promise((ok,ko)=>{const t=db.transaction(['meta','img'],'readwrite');t.objectStore('meta').put(meta);if(img)t.objectStore('img').put(img,meta.id);t.oncomplete=ok;t.onerror=()=>ko(t.error)})},
  async apaga(id){const db=await this.open();return new Promise((ok,ko)=>{const t=db.transaction(['meta','img'],'readwrite');t.objectStore('meta').delete(id);t.objectStore('img').delete(id);t.oncomplete=ok;t.onerror=()=>ko(t.error)})}
};
let FOTOS=[],FURL={},FDATA='',FMES='',FMSG='',FBUSY=false;
const hojeLocal=()=>new Date().toLocaleDateString('sv-SE');
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesNome=m=>{const [y,n]=m.split('-');return MESES[+n-1]+' '+y};
const kb=b=>b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
async function fotosCarrega(){
  try{FOTOS=(await FDB.lista()).sort((a,b)=>b.iso.localeCompare(a.iso)||b.ts-a.ts)}catch(e){FOTOS=[]}
}
const fotosDia=iso=>FOTOS.filter(f=>f.iso===iso);
const thumbURL=f=>FURL[f.id]||(FURL[f.id]=URL.createObjectURL(f.thumb));
/* reduz a foto (máx. 2200 px, JPEG) e cria a miniatura; respeita a rotação da câmara */
async function fotoProcessa(file){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){src=await new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ko(new Error('imagem'));im.src=URL.createObjectURL(file)})}
  const W=src.width||src.naturalWidth,H=src.height||src.naturalHeight;
  const faz=(max,q)=>{const k=Math.min(1,max/Math.max(W,H)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    return new Promise((ok,ko)=>c.toBlob(b=>b?ok({b,w:c.width,h:c.height}):ko(new Error('jpeg')),'image/jpeg',q))};
  return {img:await faz(2200,.86),th:await faz(360,.72)};
}
async function fotoAdiciona(files,daCam){
  const iso=FDATA||MDRAFT.d||hojeLocal();
  const lista=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if(!lista.length)return;
  FBUSY=true;FMSG='A guardar '+lista.length+' foto'+(lista.length>1?'s':'')+'…';render();
  let n=0,falhou=0;
  for(const f of lista){
    try{
      const {img,th}=await fotoProcessa(f);
      const ts=Date.now()+n,hh=new Date(ts).toTimeString().slice(0,8).replace(/:/g,'');
      const meta={id:'f'+ts.toString(36)+Math.random().toString(36).slice(2,6),iso,ts,nome:`disco_${iso}_${hh}${n?'_'+n:''}.jpg`,
        w:img.w,h:img.h,bytes:img.b.size,thumb:th.b,origem:daCam?'câmara':'galeria',noAparelho:!!(daCam&&AND&&AND.pastaFoto)};
      await FDB.put(meta,img.b);n++;
    }catch(e){falhou++}
  }
  await fotosCarrega();FBUSY=false;
  FMSG=(n?`${n} foto${n>1?'s':''} guardada${n>1?'s':''} na pasta · disco de ${dPT(iso)}`:'')+(falhou?` · ${falhou} não ${falhou>1?'puderam':'pôde'} ser lida${falhou>1?'s':''}`:'');
  FMES='';render();
}
const blobB64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(b)});
async function fotoGuardaAparelho(f,silencio){
  const b=await FDB.img(f.id);if(!b)return 'Foto não encontrada.';
  if(AND&&AND.guardarFoto){const r=AND.guardarFoto(f.nome,f.iso.slice(0,7),await blobB64(b));if(!silencio)alert(r);return r}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

  ${FOTOS.length?`<div class="row" style="margin-top:0">
      <select id="fMesF"><option value="">Todos os meses</option>${ms.map(m=>`<option value="${m}" ${FMES===m?'selected':''}>${mesNome(m)}</option>`).join('')}</select>
      <span class="chip">${FOTOS.length} foto${FOTOS.length>1?'s':''} · ${kb(tot)}</span>
      <button class="btn" id="fTodas">⇩ Guardar ${FMES?'o mês':'todas'} no telemóvel</button>
    </div>
    ${grupos.map(g=>`<div class="fgrupo"><div class="fmes">${mesNome(g.m)} <span>${g.fs.length}</span></div>
      <div class="fgrid">${g.fs.map(f=>`<button class="ftile" data-f="${f.id}" aria-label="Abrir foto do disco de ${dPT(f.iso)}">
        <img src="${thumbURL(f)}" alt="" loading="lazy"><span>${dPT(f.iso).slice(0,5)}${f.noAparelho?' · 📱':''}</span></button>`).join('')}</div></div>`).join('')}`
  :'<div class="empty">Ainda não há fotos de discos.</div>'}`;
}
/* ---- visualizador ---- */
let FV={id:null,url:null};

  const b=await FDB.img(id);if(FV.url)URL.revokeObjectURL(FV.url);

      <label class="note">Disco de <input type="date" id="fvData" value="${esc(f.iso)}"></label>

  $('#fvImg').onclick=()=>$('#fvImg').classList.toggle('zoom');

  $('#fvDel').onclick=async()=>{if(!confirm('Apagar esta foto da pasta?'))return;
    await FDB.apaga(f.id);if(FURL[f.id]){URL.revokeObjectURL(FURL[f.id]);delete FURL[f.id]}
    await fotosCarrega();const prox=FOTOS[Math.min(i,FOTOS.length-1)];if(prox)fotoAbre(prox.id);else fotoFecha();render()};
  $('#fvData').onchange=async e=>{if(!e.target.value)return;f.iso=e.target.value;f.nome=f.nome.replace(/disco_\d{4}-\d{2}-\d{2}/,'disco_'+f.iso);
    await FDB.put(f);await fotosCarrega();render();fotoAbre(f.id)};

function fotoFecha(){const el=$('#fView');if(el){el.hidden=true;el.innerHTML=''}if(FV.url)URL.revokeObjectURL(FV.url);FV={id:null,url:null};document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(!FV.id)return;if(e.key==='Escape')fotoFecha();
  const i=FOTOS.findIndex(f=>f.id===FV.id);if(e.key==='ArrowLeft'&&i>0)fotoAbre(FOTOS[i-1].id);if(e.key==='ArrowRight'&&i<FOTOS.length-1)fotoAbre(FOTOS[i+1].id)});

/* ---- câmara integrada na app (getUserMedia): pré-visualização, guia do disco, lanterna ---- */
const CAM={stream:null,track:null,facing:'environment',torch:false,recorte:true,n:0,iso:'',ocupado:false,ult:null};
const camDisponivel=()=>!!(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
async function fotoGuardaBlob(blob,iso,origem){

async function camDispara(){

  const W=v.videoWidth,H=v.videoHeight;let sx=0,sy=0,sw=W,sh=H;

    const r=v.getBoundingClientRect(),g=$('#camGuia div').getBoundingClientRect();

    sx=(g.left-r.left-ox)/k;sy=(g.top-r.top-oy)/k;sw=g.width/k;sh=g.height/k;
    const m=sw*.05;sx-=m;sy-=m;sw+=2*m;sh+=2*m;

/* ---- Descansos ---- */
function descansos(){
  const last=RESTS[RESTS.length-1],min=RESTS.reduce((a,b)=>b.dur<a.dur?b:a,RESTS[0]);
  const fora=RESTS.filter(r=>r.excede24).length;
  const longas=RESTS.filter(r=>r.amp>13*60).length;
  const rows=RESTS.map(r=>{
    const cls={'DIÁRIO REGULAR':'ok','DIÁRIO REDUZIDO':'warn','INSUFICIENTE':'bad','SEMANAL REDUZIDO':'info','SEMANAL REGULAR':'ok'}[r.status];
    const ampCls=r.amp>15*60?'bad':r.amp>13*60?'warn':'ok';
    return `<tr><td>${dPT(r.iso)}</td><td class="t">${clk(L(r.fim))}</td><td class="t">${clk(L(r.ini))}</td>
    <td class="t"><span class="tag ${ampCls}">${hm(r.amp)}</span></td>
    <td class="t">${clk(L(r.jan))}<div class="note">${dPT(dISO(new Date(L(r.jan)*60000)))}</div></td>
    <td class="t"><b>${hm(r.dentro)}</b>${r.frac?'<div class="note">+ '+hm(r.pausaMax)+' de pausa no turno</div>':''}</td>
    <td class="t">${hm(r.dur)}</td>
    <td><span class="tag ${cls}">${r.status}</span>${r.frac?' <span class="tag info">FRACIONADO</span>':''}${r.fracDuvida?' <span class="tag warn">PAUSA POR CONFIRMAR</span>':''}${r.fechaBis?' <span class="tag info">FECHA BISSEMANAL</span>':''}</td>
    <td class="t">${r.red}</td><td><span class="tag ${r.max3==='OK'?'ok':'bad'}">${r.max3}</span></td>
    <td class="t">${r.falta?hm(r.falta):'—'}</td><td>${r.comp?`<span class="tag ${r.compOk?'ok':'warn'}">${r.comp}</span>`:'—'}</td></tr>`}).join('');
  return `<div class="kgrid">
    ${kpi('Último descanso',hm(last.dur),last.dur<9*60?'bad':last.dur<11*60?'warn':'ok',last.status)}
    ${kpi('Dentro das 24h',hm(last.dentro),last.dentro<9*60?'bad':last.dentro<11*60?'warn':'ok','jornada de '+hm(last.amp))}
    ${kpi('Descanso mínimo',hm(min.dur),'',dPT(min.iso))}
    ${kpi('Reduzidos desde o semanal',last.red,last.red>3?'bad':last.red===3?'warn':'ok','máx. 3')}
    ${kpi('Jornadas > 13h',longas,longas?'warn':'ok','já não cabem 11h nas 24h')}
    ${kpi('Fora das 24h',fora,fora?'bad':'ok','nem 9h couberam')}</div>
  <div class="tw"><table><tr><th>Data</th><th>Fim do turno</th><th>Início seguinte</th><th>Jornada</th><th>Fim das 24h</th><th>Dentro das 24h</th><th>Descanso total</th><th>Status</th><th>Red.</th><th>Regra máx. 3</th><th>Falta (45h)</th><th>Compensação</th></tr>${rows}</table></div>`;
}

/* ---- Relatório de jornada: folhas DADOS, JORNADA TOTAL, DL 84 2026, DESCANSOS e EXTRAS (padrão do Excel) ---- */
let RJ_MES='',RJ_VOLTA='exportar',RJ_ABA='jornada';
const RJ_ABAS=[['dados','DADOS'],['jornada','JORNADA TOTAL'],['dl84','DL 84 2026'],['desc','DESCANSOS'],['extras','EXTRAS']];
function relJornadaDados(mes){
  const rows=ROWS.filter(r=>!mes||r.iso.slice(0,7)===mes);
  if(!rows.length)return null;
  const seg=iso=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return dISO(d)};
  const fim=rows[rows.length-1].iso, sem=[];let acum=0;
  for(let d=new Date(seg(rows[0].iso)+'T00:00:00Z');dISO(d)<=fim;d.setUTCDate(d.getUTCDate()+7)){
    const k=dISO(d),e=new Date(d);e.setUTCDate(e.getUTCDate()+6);const kEnd=dISO(e);
    const rs=rows.filter(r=>r.iso>=k&&r.iso<=kEnd);
    const s={k,kEnd,dias:rs.filter(r=>r.jornada>0).length,cond:0,ot:0,disp:0,esp:0,pausa:0,jorn:0};
    for(const r of rs){s.cond+=r.cond;s.ot+=r.ot;s.disp+=r.disp;s.esp+=r.esp;s.pausa+=r.pausa;s.jorn+=r.jornada}
    acum+=s.jorn;s.media=s.dias?s.jorn/s.dias:null;s.acum=acum;sem.push(s);
  }
  const T={dias:0,cond:0,ot:0,disp:0,esp:0,pausa:0,jorn:0};
  for(const s of sem)for(const f in T)T[f]+=s[f];
  T.mediaDia=T.dias?T.jorn/T.dias:0;T.mediaSem=sem.length?T.jorn/sem.length:0;
  const ini=rows[0].iso;
  // o mesmo período para as outras folhas
  const fimP=mes?(()=>{const e=new Date(mes+'-01T00:00:00Z');e.setUTCMonth(e.getUTCMonth()+1);e.setUTCDate(0);return dISO(e)})():fim;
  const iniP=mes?mes+'-01':ini;
  const semDL=WEEKS.filter(w=>w.kEnd>=iniP&&w.k<=fimP);
  const desc=RESTS.map((r,i)=>({r,row:ROWS[i]})).filter(x=>x.r.iso>=iniP&&x.r.iso<=fimP);
  const ext=extraRows().filter(x=>x.iso>=iniP&&x.iso<=fimP);
  return {sem,T,ini,fim,mes,rows,semDL,desc,ext};
}
function rjIdent(){
  const P=S.perfil||{};
  const nome=IDENT?(IDENT.nome+' '+IDENT.ap):[P.nome,P.ap].filter(Boolean).join(' ');
  const cartao=IDENT?IDENT.card:(P.cartao||'');
  return {nome:nome.trim(),cartao,empresa:P.empresa||'',matricula:P.matricula||''};
}
function rjPeriodo(R){return R.mes?'Mês de '+dPT(R.mes+'-01').slice(3):dPT(R.ini)+' a '+dPT(R.fim)}
function rjIdLinha(R){const I=rjIdent();return [I.nome&&'Condutor: '+I.nome,I.cartao&&'Cartão: '+I.cartao,I.empresa,I.matricula&&'Matrícula: '+I.matricula,'Período: '+rjPeriodo(R)].filter(Boolean)}
const RJ_SUB='Soma toda a jornada (Início ao Fim) e os seus componentes: Condução + Outros Trabalhos + Disponibilidade + Espera Doc. + Pausa. Semana = segunda a domingo.';

const DL_SUB='Limites do art. 21.º do DL 84/2026: máx. 60h de trabalho por semana e média de 48h num período de 4 meses (≈17 semanas). Tempo de trabalho = Condução + Outros Trabalhos + Disponibilidade. Semana = segunda a domingo. BISSEMANAL: a contagem reinicia sempre que existe um descanso igual ou superior ao limiar definido na app (por defeito 45h) — esse descanso fecha o período anterior e o novo começa no turno seguinte. As colunas bissemanais mostram o acumulado do período em curso até ao fim dessa semana. Limite de condução na bissemanal: 90h (Reg. 561/2006, art. 6.º/3).';
const DL_NOTA='Nota: os limites de 60h e média de 48h (4 meses) vêm do artigo 21.º do DL 84/2026. Colunas bissemanais: condução acumulada no período bissemanal em curso — limite de 90h (Reg. 561/2006); a partir de 112h30 aplica-se o agravamento de 20% das coimas (art. 39.º, n.º 2 do DL 84/2026). Fonte de dados: folha DADOS.';
const DS_SUB='Descanso calculado pela LÓGICA DAS 24 HORAS (Reg. 561/2006, art. 8.º/2): o período de 24h começa no início do turno e o descanso diário tem de estar COMPLETO dentro dessas 24 horas — jornada até 13h: DIÁRIO REGULAR · de 13h a 15h: DIÁRIO REDUZIDO (máx. 3 entre dois descansos semanais, art. 8.º/4) · acima de 15h: INFRAÇÃO. A coluna "Dentro das 24h" é a que decide. Fracionado (art. 4.º, al. g): 3h seguidas de pausa no turno + 9h a seguir valem como regular. Semanais: ≥24h REDUZIDO · ≥45h REGULAR; as horas em falta até 45h compensam-se até ao fim da 3.ª semana seguinte (art. 8.º/6).';
const EX_SUB='Dias marcados como Extra nos Registos e dias trabalhados a sábado, domingo ou feriado. Valores e estado de pagamento lançados na aba Extras da app.';
/* nota da folha DESCANSOS (mesma lógica da coluna Nota do Excel) */
function notaDesc(r){
  if(r.status==='INSUFICIENTE')return r.amp>15*60?'JORNADA '+hm(r.amp)+' — nem 9h cabem nas 24h':'DESCANSO '+hm(r.dur)+' — abaixo das 9h';
  if(r.weekly&&r.dentro<9*60)return 'JORNADA '+hm(r.amp)+' — o semanal começou fora das 24h';
  if(r.frac)return 'FRACIONADO — pausa de '+hm(r.pausaMax)+' no turno + '+hm(r.dentro)+' a seguir';
  if(r.fracDuvida)return 'PAUSA DE '+hm(r.pausaMax)+' — se foi seguida, vale como fracionado (regular)';
  if(r.status==='DIÁRIO REDUZIDO')return r.amp>13*60?'JORNADA '+hm(r.amp)+' — as 11h já não cabiam nas 24h':'DESCANSO '+hm(r.dentro)+' — não chegou às 11h';
  return '—';
}
const estSem=t=>t>60*60?'EXCESSO':t>55*60?'ALERTA':'OK';
const estBis=c=>c>112.5*60?'AGRAV. +20%':c>90*60?'EXCESSO':c>=0.8*90*60?'ALERTA':'OK';
const corEst=v=>/EXCESSO|AGRAV|INSUFIC|COMPENSAR|EXCEDIDO|MÉDIA >/.test(v)?'bad':/ALERTA|REDUZIDO/.test(v)?'warn':/^OK$|REGULAR|COMPENSADO/.test(v)?'ok':'';
const dtl=abs=>dPT(dISO(new Date(L(abs)*60000)))+' '+clk(L(abs));
const eurN=v=>(Math.round(v*100)/100).toFixed(2).replace('.',',');
